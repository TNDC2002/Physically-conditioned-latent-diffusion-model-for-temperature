task_name: train
tags:
- downscaling
- lmm_res_2mT
train: true
test: true
compile: false
ckpt_path: ${paths.root_dir}/logs/train/runs/2026-05-14_07-18-49/checkpoints/best_LMM_res_2mT_epoch_020.ckpt
reset_scheduler_on_resume: true
reset_lr_to_default_on_resume: true
reset_lr_default_value: null
seed: 42
optimized_metric: val/control_score
data:
  _target_: src.data.downscaling_datamodule.DownscalingDataModule
  data_dir: ${paths.data_dir}
  static_vars:
    dtm_tif_file: ${paths.data_dir}/static_var/dtm_2km_domain_trim_EPSG3035.tif
    lc_tif_file: ${paths.data_dir}/static_var/land_cover_classes_2km_domain_trim_EPSG3035.tif
    lat_tif_file: ${paths.data_dir}/static_var/lat_2km_domain_trim_EPSG3035.tif
  target_vars:
    low_res:
    - 2mT
    - PMSL
    - U10
    - V10
    - dp2mT
    - SST
    - SNDPT
    - TP
    - SSRadIn
    - Q850
    - T850
    - U850
    - V850
    - W850
    high_res:
    - 2mT
  batch_size: 25
  num_workers: 6
  pin_memory: true
  crop_size: 512
  nn_lowres: false
  skip_dynamic_load: false
model:
  _target_: src.models.lmm_module.LatentMeanFlowLitModule
  mf_unet:
    _target_: src.models.components.ldm.denoiser.MFUNet
    in_channels: 32
    model_channels: 256
    out_channels: 32
    num_res_blocks: 2
    attention_resolutions:
    - 1
    - 2
    dims: 2
    channel_mult:
    - 1
    - 2
    - 4
    num_heads: 8
    context_ch:
    - 256
    - 512
    - 1024
    time_scale: 1000
    separate_r_mlp: false
  meanflow_core:
    _target_: src.models.components.meanflow.meanflow_core.MeanFlowCore
    flow_ratio: 0.5
    time_dist: lognorm
    time_mu: -0.4
    time_sigma: 1.0
  use_meanflow_paper_core: true
  meanflow_paper: null
  autoencoder:
    _target_: src.models.ae_module.AutoencoderKL
    encoder:
      _target_: src.models.components.ae.SimpleConvEncoder
      levels: 3
    decoder:
      _target_: src.models.components.ae.SimpleConvDecoder
      levels: 3
    unet_regr:
      _target_: src.models.unet_module.UnetLitModule
      net:
        _target_: src.models.components.unet.DownscalingUnet
        in_ch: 32
        out_ch: 1
        features:
        - 64
        - 128
        - 256
        - 512
      loss:
        _target_: torch.nn.MSELoss
        reduction: mean
      optimizer: null
      ckpt_path: ${paths.pretrained_models_dir}UNET_2mT.ckpt
    ae_flag: residual
  context_encoder:
    _target_: src.models.components.ldm.conditioner.AFNOConditionerNetCascade
    autoencoder:
    - _target_: src.models.ae_module.AutoencoderKL
      encoder:
        _target_: src.models.components.ae.SimpleConvEncoder
        in_dim: 18
        levels: 3
        ch_mult: 3
      decoder: null
    - _target_: src.models.ae_module.EncoderLRES
    train_autoenc: true
    cascade_depth: 3
    embed_dim:
    - 128
    - 24
    analysis_depth:
    - 4
    - 4
    afno_fusion: true
    input_size_ratios:
    - 1
    - 1
    embed_dim_out: 256
  lr: 0.0001
  lr_warmup: 0
  use_ema: true
  loss_type: l2
  control_metric_weights:
    loss: 0.0
    legacy_adaptive_l2: 0.0
    mf_loss_f64: 0.0
    mf_minus_1: 100000000.0
    loss_total_f64: 0.0
    rmse: 0.0
    r2: 0.0
    temp_pde_pure: 0.0
    at_mag_pure: 0.01
    at_dir_pure: 0.1
  pde_lambda: 0.0
  pde_mode: temp
  temp_pde_coef: 0.0
  temp_pde_num_supercells: 8
  anisotropic_transport_coef: 1.0e-09
  at_lambda_mag: 0.1
  at_lambda_dir: 1.0
  at_loss_eps: 1.0e-20
  at_direction_loss: unit_mse
  at_dx: 2000.0
  at_dy: -2000.0
  at_qmag_quantile: null
  at_qmag_min: 1.0e-10
  ae_load_state_file: ${paths.pretrained_models_dir}VAE_residual_2mT.ckpt
  trainable_parts:
  - mf_unet.middle_block
  - mf_unet.output_blocks
  - mf_unet.out
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: best_LMM_res_2mT_epoch_{epoch:03d}
    monitor: val/control_score
    verbose: false
    save_last: false
    save_top_k: 1
    mode: min
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/control_score
    min_delta: 0.0
    patience: 10
    verbose: true
    mode: min
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  rich_progress_bar: null
  model_checkpoint_periodic:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: LMM_res_2mT_every5_epoch_{epoch:03d}
    monitor: null
    mode: min
    save_top_k: -1
    save_last: false
    auto_insert_metric_name: false
    verbose: false
    every_n_epochs: 5
    save_on_train_epoch_end: false
  model_checkpoint_last:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: null
    mode: min
    save_top_k: 0
    save_last: true
    auto_insert_metric_name: false
    verbose: false
    every_n_epochs: 0
    save_on_train_epoch_end: false
logger:
  tensorboard:
    _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard/
    name: null
    log_graph: false
    default_hp_metric: true
    prefix: ''
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 100
  accelerator: gpu
  devices: 2
  strategy: ddp_find_unused_parameters_true
  check_val_every_n_epoch: 1
  deterministic: false
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/LDM-downscaling/full_Dataset/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  pretrained_models_dir: ${paths.root_dir}/pretrained_models/
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
load_optimizer_state: false
